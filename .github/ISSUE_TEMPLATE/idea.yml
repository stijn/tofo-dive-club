# The form behind "Suggest it on GitHub" in the site's demo notice.
name: Idea for the site · Ideia para o site
description: Suggest something to add or change on the Tofo Dive Club site. Sugira algo para acrescentar ou mudar no site.
title: "Idea: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Thanks! Write in English or Portuguese, whichever you prefer. · Obrigado! Escreva em inglês ou em português, como preferir.
  - type: textarea
    id: idea
    attributes:
      label: What's the idea? · Qual é a ideia?
      description: What should change, and why? · O que deve mudar, e porquê?
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where on the site? · Onde no site?
      options:
        - The whole site · O site todo
        - Top of the page · Topo da página
        - The club · O clube
        - Dives · Mergulhos
        - Dive sites · Locais de mergulho
        - Seasons · Épocas
        - Offer · Oferta
        - Join form · Formulário
        - Questions · Perguntas
        - Dive words · Glossário
        - Something new · Algo novo
  - type: textarea
    id: extra
    attributes:
      label: Links, photos or examples (optional) · Links, fotos ou exemplos (opcional)
      description: You can drag photos into this box. · Pode arrastar fotos para esta caixa.
